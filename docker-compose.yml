services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: refunds
      MYSQL_USER: refunds
      MYSQL_PASSWORD: ${DB_PASSWORD:-refunds-secret}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root-secret}
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD:-root-secret}"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_NAME: "Support Center"
      APP_ENV: production
      APP_DEBUG: "false"
      APP_URL: http://localhost:8080
      APP_KEY: ${APP_KEY:-}
      LOG_CHANNEL: stderr
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: refunds
      DB_USERNAME: refunds
      DB_PASSWORD: ${DB_PASSWORD:-refunds-secret}
      SESSION_DRIVER: database
      CACHE_STORE: database
      QUEUE_CONNECTION: sync
      # AI providers: set at least GROQ_API_KEY in .env to enable the AI agent.
      LLM_PROVIDER_ORDER: ${LLM_PROVIDER_ORDER:-groq,groq_backup,grok}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-openai/gpt-oss-120b}
      GROQ_BACKUP_MODEL: ${GROQ_BACKUP_MODEL:-openai/gpt-oss-20b}
      GROQ_REASONING_EFFORT: ${GROQ_REASONING_EFFORT:-medium}
      GROK_API_KEY: ${GROK_API_KEY:-}
      GROK_MODEL: ${GROK_MODEL:-grok-3-mini}
      SUPPORT_EMAIL: ${SUPPORT_EMAIL:-support@example.com}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@example.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-password}

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "${APP_PORT:-8080}:80"

volumes:
  db-data:
